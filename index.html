*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
background:radial-gradient(900px 500px at 70% -10%,#2c1a5e 0%,#0F0A1E 60%);color:#EDE9FE;padding:24px}
.box{width:min(360px,92vw);text-align:center}
.heart{font-size:52px;margin-bottom:14px}
h1{font-size:22px;margin-bottom:6px} h1 span{color:#A78BFA}
p{color:#A79BC8;font-size:13px;margin-bottom:26px}
.pwwrap{position:relative}
input{width:100%;padding:14px 48px 14px 16px;border-radius:14px;border:1px solid #43299B;background:#1B1230;

.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;width:38px;margin:0;padding:8px;cursor:pointer;font-size:18px;opacity:.75}
input:focus{border-color:#7C3AED}
button{width:100%;margin-top:12px;padding:14px;border-radius:14px;border:none;cursor:pointer;
background:linear-gradient(90deg,#7C3AED,#A78BFA);color:#fff;font-size:15px;font-weight:700}
button:disabled{opacity:.6}
.err{color:#F87171;font-size:12.5px;margin-top:12px;min-height:16px}
.foot{margin-top:34px;color:#5B4A85;font-size:11px}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryOpen(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  for(const sl of ENC.slots){
    try{
      const kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b2a(sl.salt), iterations:ENC.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const mk = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2a(sl.iv)}, kek, b2a(sl.wk));
      const key = await crypto.subtle.importKey('raw', mk, 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2a(ENC.ivp)}, key, b2a(ENC.ct));
      return new TextDecoder().decode(plain);
    }catch(e){}
  }
  throw new Error('senha');
}
async function go(){
  const pw = document.getElementById('pw').value.trim();
  if(!pw) return;
  const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Abrindo…';
  try{
    const html = await tryOpen(pw);
    try{ sessionStorage.setItem('cf_pw', pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Abrir';
    document.getElementById('err').textContent = 'Senha incorreta — tente de novo.';
    const bx = document.getElementById('box'); bx.classList.remove('shake'); void bx.offsetWidth; bx.classList.add('shake');
  }
}
document.getElementById('go').onclick = go;
document.getElementById('eye').onclick = () => {
  const i = document.getElementById('pw');
  i.type = i.type === 'password' ? 'text' : 'password';
  document.getElementById('eye').textContent = i.type === 'password' ? '👁' : '🙈';
  i.focus();
};
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
try{ const saved = sessionStorage.getItem('cf_pw'); if(saved){ document.getElementById('pw').value = saved; go(); } }catch(e){}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
